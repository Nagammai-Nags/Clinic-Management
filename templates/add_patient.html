{% extends "base.html" %}
{% block content %}
<h2 class="mb-3">Add New Patient</h2>
<form method="post" class="form-grid">
  <div><label class="form-label">Name</label><input class="form-control" name="name" required></div>
  <div><label class="form-label">Age</label><input type="number" class="form-control" name="age" required></div>
  <div><label class="form-label">Gender</label><select class="form-select" name="gender"><option>Male</option><option>Female</option><option>Other</option></select></div>
  <div><label class="form-label">Phone</label><input class="form-control" name="phone" required></div>
  <div><label class="form-label">Appointment Date</label><input type="date" class="form-control" name="appointment_date" value="{{ today }}" required></div>
  <div><label class="form-label">Blood Group</label><input class="form-control" name="blood" placeholder="O+"></div>
  <div class="grid-wide"><label class="form-label">Address</label><textarea class="form-control" name="address" required></textarea></div>
  <div class="grid-wide"><button class="btn btn-primary">Save Patient</button></div>
</form>
{% endblock %}
